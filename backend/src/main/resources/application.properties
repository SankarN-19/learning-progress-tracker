spring.config.import=optional:file:./.env[.properties]
spring.application.name=learning-progress-tracker
server.port=8080

# --- Database (values come from environment / backend/.env; see .env.example) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learning_tracker?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:lpt_user}
spring.datasource.password=${DB_PASSWORD}

# Schema and seed come from schema.sql / data.sql (idempotent), not from Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- JSON ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Session cookie (HttpOnly + SameSite; set SESSION_COOKIE_SECURE=true on HTTPS) ---
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# --- App settings ---
app.login.max-attempts=5
app.login.window-minutes=15
app.temp-password.hours=24
app.coordinator.email=${APP_COORDINATOR_EMAIL:}
app.coordinator.password=${APP_COORDINATOR_PASSWORD:}

# Never log request bodies / SQL parameters (they could contain passwords)
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
